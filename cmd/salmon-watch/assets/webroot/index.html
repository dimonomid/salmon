<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salmon status</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <h1>&gt;&lt;&gt; Salmon status</h1>
  <div><span id="connection-status">Connecting…</span></div>
  <div id="status-summary" hidden>
    <div>
      <button id="server-summary" class="section-summary" type="button" hidden></button>
    </div>
    <div id="hosts" hidden></div>
    <div>
      <button id="incident-summary" class="section-summary" type="button"></button>
    </div>
    <div id="incidents"></div>
    <div>
      <button id="snoozed-summary" class="section-summary" type="button"></button>
    </div>
    <div id="snoozed-incidents"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
