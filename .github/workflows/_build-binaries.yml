name: build-binaries

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or commit to build
        type: string
        required: true
      artifact_prefix:
        description: Prefix for the uploaded workflow artifact names
        type: string
        required: true
      retention_days:
        description: Number of days to retain the workflow artifacts
        type: number
        required: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install salmon-watch build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Build binaries
        run: |
          mkdir dist
          go build -trimpath -o dist/salmon ./cmd/salmon
          go build -trimpath -o dist/salmon-watch ./cmd/salmon-watch

      - name: Package binaries
        run: |
          mkdir release
          tar -czf "release/salmon_linux_${RUNNER_ARCH}.tar.gz" -C dist salmon
          tar -czf "release/salmon-watch_linux_${RUNNER_ARCH}.tar.gz" -C dist salmon-watch

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-linux
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  build-salmon-watch:
    name: Build salmon-watch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            output: salmon-watch
          - os: windows
            runner: windows-latest
            output: salmon-watch.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Create output directory
        run: mkdir dist

      - name: Build salmon-watch
        run: go build -trimpath -o "dist/${{ matrix.output }}" ./cmd/salmon-watch

      - name: Package macOS binary
        if: matrix.os == 'macos'
        run: |
          mkdir release
          tar -czf "release/salmon-watch_macos_${RUNNER_ARCH}.tar.gz" -C dist salmon-watch

      - name: Package Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path dist/salmon-watch.exe -DestinationPath "release/salmon-watch_windows_${env:RUNNER_ARCH}.zip"

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
