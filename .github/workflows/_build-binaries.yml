name: binaries

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or commit to build
        type: string
        required: true
      artifact_prefix:
        description: Prefix for the uploaded workflow artifact names
        type: string
        required: true
      retention_days:
        description: Number of days to retain the workflow artifacts
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  salmon:
    name: salmon (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Build salmon
        shell: bash
        run: make salmon

      - name: Package salmon
        run: |
          mkdir release
          tar -czf "release/salmon-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}.tar.gz" -C bin salmon

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        run: |
          bash util/prepare_release_artifact.sh \
            "release/salmon-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}.tar.gz" \
            bin/salmon \
            "salmon-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}"

      - name: Upload intermediary salmon artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-salmon-linux
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  watch-legacy:
    name: salmon-watch-legacy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_os: linux
          - os: macos
            runner: macos-latest
            artifact_os: darwin
          - os: windows
            runner: windows-latest
            artifact_os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install make
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Build salmon-watch-legacy
        shell: bash
        run: make salmon-watch-legacy

      - name: Package Unix binary
        if: matrix.os != 'windows'
        run: |
          mkdir release
          tar -czf "release/salmon-watch-LEGACY-WEB-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz" -C bin salmon-watch-legacy

      - name: Package Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path bin/salmon-watch-legacy.exe -DestinationPath "release/salmon-watch-LEGACY-WEB-${env:ARTIFACT_VERSION}_windows_${env:ARTIFACT_ARCH}.zip"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            archive="release/salmon-watch-LEGACY-WEB-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.zip"
            binary="bin/salmon-watch-legacy.exe"
            signature_basename="salmon-watch-LEGACY-WEB-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.exe"
          else
            archive="release/salmon-watch-LEGACY-WEB-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz"
            binary="bin/salmon-watch-legacy"
            signature_basename="salmon-watch-LEGACY-WEB-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}"
          fi
          bash util/prepare_release_artifact.sh "$archive" "$binary" "$signature_basename"

      - name: Upload intermediary salmon-watch-legacy artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-salmon-watch-legacy-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  watch:
    name: salmon-watch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_os: linux
          - os: macos
            runner: macos-latest
            artifact_os: darwin
          - os: windows
            runner: windows-latest
            artifact_os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install make
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
            *)
              echo "Unsupported Rust host architecture: $host" >&2
              exit 1
              ;;
          esac
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$arch" >> "$GITHUB_ENV"

      - name: Build salmon-watch
        if: matrix.os != 'linux'
        shell: bash
        run: make salmon-watch

      - name: Build salmon-watch on Ubuntu 20.04
        if: matrix.os == 'linux'
        shell: bash
        run: bash .github/build-salmon-watch-linux.sh

      - name: Package Unix binary
        if: matrix.os != 'windows'
        run: |
          mkdir release
          tar -czf "release/salmon-watch-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz" -C bin salmon-watch

      - name: Package Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path bin/salmon-watch.exe -DestinationPath "release/salmon-watch-${env:ARTIFACT_VERSION}_windows_${env:ARTIFACT_ARCH}.zip"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            archive="release/salmon-watch-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.zip"
            binary="bin/salmon-watch.exe"
            signature_basename="salmon-watch-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.exe"
          else
            archive="release/salmon-watch-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz"
            binary="bin/salmon-watch"
            signature_basename="salmon-watch-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}"
          fi
          bash util/prepare_release_artifact.sh "$archive" "$binary" "$signature_basename"

      - name: Upload intermediary salmon-watch artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-salmon-watch-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  assemble:
    name: Assemble
    needs:
      - salmon
      - watch-legacy
      - watch
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download binaries and SBOMs
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: ${{ inputs.artifact_prefix }}-*
          merge-multiple: true

      - name: Generate checksums
        run: bash util/prepare_release_checksums.sh release

      - name: Show release contents
        run: |
          {
            echo "### Release contents"
            echo
            echo '```text'
            find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-artifacts
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Remove intermediary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          for suffix in \
            salmon-linux \
            salmon-watch-legacy-linux \
            salmon-watch-legacy-macos \
            salmon-watch-legacy-windows \
            salmon-watch-linux \
            salmon-watch-macos \
            salmon-watch-windows; do
            artifact_name="${ARTIFACT_PREFIX}-${suffix}"
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id"
            )"
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done
