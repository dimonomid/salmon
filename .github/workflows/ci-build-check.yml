name: ci-build-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-binaries.yml
    with:
      source_ref: ${{ github.sha }}
      artifact_prefix: build-check
      retention_days: 7
